<!DOCTYPE html>
<html>
<head>
    <title>Cast Your Vote</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Cast Your Vote</h1>
</header>

<div class="candidate-container">

    <div class="candidate-card">
        <img src="images/candidate1.png" alt="Candidate">
        <h3>Rahul Sharma</h3>
        <p>Party: People's Party</p>
        <button>Vote</button>
    </div>

    <div class="candidate-card">
        <img src="images/candidate2.png" alt="Candidate">
        <h3>Priya Verma</h3>
        <p>Party: National Party</p>
        <button>Vote</button>
    </div>

    <div class="candidate-card">
        <img src="images/candidate3.png" alt="Candidate">
        <h3>Amit Patil</h3>
        <p>Party: Youth Party</p>
        <button>Vote</button>
    </div>

</div>

</body>
</html>
